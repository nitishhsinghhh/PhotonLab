#                                                                    */
# DESCRIPTION : Enforces C++17 standards, formatting, and safety     */
#               using the LLVM 16 toolchain. Optimized for the       */
#               nested Native/PhotonLab.Native directory layout with */
#               strict case-exact path validation (Src/Include).     */
#                                                                    */
# SIDE EFFECTS: Fails the build on any style deviation or detected   */
#               memory safety issues (warnings-as-errors).           */
