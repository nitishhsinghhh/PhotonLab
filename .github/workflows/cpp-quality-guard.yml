name: C++ Quality Guard

on:
  push:
    branches: ["main"]
    paths:
      - 'Native/PhotonLab.Native/src/**'
      - 'Native/PhotonLab.Native/include/**'
      - 'Native/PhotonLab.Native/CMakeLists.txt'
      - '.github/workflows/cpp-quality-guard.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'Native/PhotonLab.Native/src/**'
      - 'Native/PhotonLab.Native/include/**'
      - 'Native/PhotonLab.Native/CMakeLists.txt'
      - '.github/workflows/cpp-quality-guard.yml'
  workflow_dispatch:

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Native/PhotonLab.Native

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format \
            clang-tidy \
            cmake \
            build-essential \
            jq

      - name: Configure Project
        run: |
          cmake -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Verify Formatting
        run: |
          find src include \
            -type f \
            \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) \
            -print0 | \
            xargs -0 clang-format --dry-run --Werror

      - name: Run Clang-Tidy
        run: |
          find src \
            -type f \
            -name "*.cpp" \
            -print0 | \
            xargs -0 clang-tidy \
            -p build \
            --warnings-as-errors='*' \
            --header-filter='.*'

      - name: Build Validation
        run: |
          cmake --build build --config Release --parallel

      - name: Run Unit Tests
        run: |
          ctest \
            --test-dir build \
            --output-on-failure \
            --verbose

      - name: Upload Compile Commands
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands
          path: Native/PhotonLab.Native/build/compile_commands.json
          if-no-files-found: ignore

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: Native/PhotonLab.Native/build/Testing
          if-no-files-found: ignore
